<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PING POW!">
<meta name="theme-color" content="#1d1a3a">
<link rel="icon" type="image/png" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>PING POW!</title>
<link rel="preload" href="./assets/fonts/Jersey15.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" hidden>
  <div class="side" id="hud-p2">
    <div class="info"><span class="score" id="score-1">0</span><span class="name" id="name-1"></span>
      <div class="bar"><i id="bar-1"></i></div></div>
    <button class="power" id="power-1" hidden></button>
  </div>
  <div class="side" id="hud-p1">
    <div class="info"><span class="score" id="score-0">0</span><span class="name" id="name-0"></span>
      <div class="bar"><i id="bar-0"></i></div></div>
    <button class="power" id="power-0" hidden></button>
  </div>
  <div class="toast-wrap" id="tw-1"><div class="toast" id="toast-1"></div></div>
  <div class="toast-wrap" id="tw-0"><div class="toast" id="toast-0"></div></div>
  <button id="btn-pause" aria-label="Pausar">⏸</button>
  <div id="net-ping" hidden></div>
</div>

<section class="screen" id="screen-boot">
  <h1 class="title" data-text="TITLE"></h1>
  <p class="blink" data-text="tapToPlay"></p>
</section>

<section class="screen" id="screen-menu" hidden>
  <h1 class="title" data-text="TITLE"></h1>
  <p class="label" data-text="whoAreYou"></p>
  <div class="row" id="who">
    <button class="chip" data-who="a"></button>
    <button class="chip" data-who="b"></button>
  </div>
  <button class="big" id="btn-local" data-text="local"></button>
  <button class="big" id="btn-cpu" data-text="cpu"></button>
  <div class="row" id="cpu-levels" hidden>
    <button class="chip" data-level="easy" data-text="easy"></button>
    <button class="chip" data-level="normal" data-text="normal"></button>
    <button class="chip" data-level="hard" data-text="hard"></button>
  </div>
  <button class="big" id="btn-online" data-text="online"></button>
  <footer><button class="icon btn-sound" aria-label="Som">🔊</button><span id="version"></span></footer>
</section>

<section class="screen online" id="screen-online" hidden>
  <h2 data-text="online"></h2>
  <button class="big" id="btn-host" data-text="createRoom"></button>
  <button class="big" id="btn-join" data-text="joinRoom"></button>
  <button class="big" id="btn-online-back" data-text="back"></button>
</section>

<section class="screen online" id="screen-host" hidden>
  <p class="label" data-text="roomCode"></p>
  <p class="code" id="room-code"></p>
  <button class="big" id="btn-share" data-text="shareCode" hidden></button>
  <p class="label net-status" id="host-status"></p>
  <p class="label hint" data-text="keepOpen"></p>
  <button class="big" id="btn-host-cancel" data-text="cancel"></button>
</section>

<section class="screen online" id="screen-join" hidden>
  <p class="label" data-text="typeCode"></p>
  <input id="join-code" class="code" maxlength="4" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Código da sala">
  <button class="big" id="btn-join-go" data-text="enter"></button>
  <p class="label net-status" id="join-status"></p>
  <button class="big" id="btn-join-cancel" data-text="cancel"></button>
</section>

<section class="screen dim" id="screen-pause" hidden>
  <h2 data-text="paused"></h2>
  <button class="big" id="btn-resume" data-text="resume"></button>
  <button class="big" id="btn-pause-menu" data-text="menu"></button>
  <button class="icon btn-sound" aria-label="Som">🔊</button>
</section>

<section class="screen dim" id="screen-over" hidden>
  <div class="hero"><div class="rays"></div><div class="portrait" id="over-portrait"></div></div>
  <h2 id="over-msg"></h2>
  <p class="label" id="over-score"></p>
  <p class="label" id="over-note"></p>
  <button class="big" id="btn-rematch" data-text="rematch"></button>
  <button class="big" id="btn-over-menu" data-text="menu"></button>
</section>

<section class="screen dim" id="screen-sound" hidden>
  <h2 data-text="sound"></h2>
  <div class="vol" data-kind="music"><span class="lbl" data-text="music"></span><span class="val"></span>
    <div class="track" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100"><i></i><b></b></div></div>
  <div class="vol" data-kind="sfx"><span class="lbl" data-text="sfx"></span><span class="val"></span>
    <div class="track" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100"><i></i><b></b></div></div>
  <button class="big" id="btn-mute"></button>
  <button class="big" id="btn-sound-ok" data-text="done"></button>
</section>

<div id="net-wait" hidden><p class="blink" data-text="reconnecting"></p><button class="big" id="btn-net-menu" data-text="menu"></button></div>
<div id="notice" hidden></div>
<div id="rotate" hidden><p data-text="rotate"></p></div>
<div id="install-hint" hidden><span data-text="install"></span><button class="icon" id="btn-hint-close" aria-label="Fechar">✕</button></div>
<div id="fps" hidden></div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
